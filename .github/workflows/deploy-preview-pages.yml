name: Deploy Preview to GitHub Pages
# Deploys main to the Pages root while keeping PR previews under previews/pr-<number>/.
# This allows production and preview deployments to coexist on gh-pages.

on:
  push:
    branches:
      - main
    paths:
      - "preview/**"
      - "assets/svg/**"
      - "manifests/**"
      - "specs/**"
      - ".github/workflows/deploy-preview-pages.yml"
  pull_request:
    branches:
      - main
    paths:
      - "preview/**"
      - "assets/svg/**"
      - "manifests/**"
      - "specs/**"
      - ".github/workflows/deploy-preview-pages.yml"
  workflow_dispatch:

# contents: write  — push to gh-pages branch
# pull-requests: write — post/update preview comment
permissions:
  contents: write
  pull-requests: write
  deployments: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: wm-asset-workflows

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        working-directory: wm-asset-workflows
        run: npm ci

      - name: Build spec index
        working-directory: wm-asset-workflows
        run: npm run build:specs

      - name: Build site
        run: |
          mkdir -p _site/preview
          mkdir -p _site/manifests
          mkdir -p _site/assets/svg
          cp wm-asset-workflows/preview/index.html _site/preview/
          cp wm-asset-workflows/preview/app.js _site/preview/
          cp wm-asset-workflows/preview/styles.css _site/preview/
          cp wm-asset-workflows/preview/spec-index.json _site/preview/
          cp wm-asset-workflows/manifests/assets.json _site/manifests/
          cp -R wm-asset-workflows/assets/svg/. _site/assets/svg/
          sed -i 's|href="/node_modules/@wintermuted/ui-theme/index.css"|href="./ui-theme/index.css"|g' _site/preview/index.html
          mkdir -p _site/preview/ui-theme
          cp wm-asset-workflows/node_modules/@wintermuted/ui-theme/index.css _site/preview/ui-theme/
          cp -R wm-asset-workflows/node_modules/@wintermuted/ui-theme/styles _site/preview/ui-theme/
          touch _site/.nojekyll

      - name: Configure git identity
        working-directory: wm-asset-workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create PR deployment record
        if: github.event_name == 'pull_request'
        id: create_deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha,
              environment: `preview/pr-${context.payload.pull_request.number}`,
              description: `Preview for PR #${context.payload.pull_request.number}`,
              auto_merge: false,
              required_contexts: []
            });

            core.setOutput('deployment_id', String(deployment.data.id));

      - name: Deploy to gh-pages (full replace)
        working-directory: wm-asset-workflows
        run: |
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add --detach ../gh-pages-out FETCH_HEAD
          else
            git worktree add --orphan -b gh-pages ../gh-pages-out
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            preview_dir="../gh-pages-out/previews/pr-${{ github.event.pull_request.number }}"
            rm -rf "$preview_dir"
            mkdir -p "$preview_dir"
            cp -R ../_site/. "$preview_dir/"
          else
            # Replace root content but preserve previews so PR links remain valid.
            find ../gh-pages-out -mindepth 1 -maxdepth 1 ! -name '.git' ! -name 'previews' -exec rm -rf {} +
            cp -R ../_site/. ../gh-pages-out/
          fi

          cd ../gh-pages-out
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Deploy (${{ github.event_name }}): ${{ github.sha }}"
            git push --force origin HEAD:refs/heads/gh-pages
          fi

      - name: Post PR preview comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const base = 'https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}';
            const previewUrl = `${base}/previews/pr-${{ github.event.pull_request.number }}/preview/`;
            const sha = '${{ github.sha }}'.substring(0, 7);

            const body = `🚀 **PR Preview deployed!**\n\n📖 [Open preview](${previewUrl})\n\n> ℹ️ Production remains at root Pages URL. This preview is isolated to PR #${{ github.event.pull_request.number }}.\n\n_Run \`${{ github.run_id }}\` — commit \`${sha}\`_`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages-out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Health check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/previews/pr-${{ github.event.pull_request.number }}/preview/"
          else
            url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/preview/"
          fi
          echo "Health check URL: $url"
          for i in 1 2 3 4 5; do
            status=$(curl -s -o /dev/null -w "%{http_code}" -L "$url")
            echo "Attempt $i: HTTP $status"
            if [ "$status" = "200" ]; then
              echo "Health check passed."
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed: $url did not return 200 after 5 attempts."
          exit 1

      - name: Mark PR deployment success
        if: github.event_name == 'pull_request' && success()
        uses: actions/github-script@v7
        with:
          script: |
            const deploymentId = Number('${{ steps.create_deployment.outputs.deployment_id }}');
            if (!deploymentId) {
              core.info('No deployment id found; skipping deployment status update.');
              return;
            }

            const previewUrl = 'https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/previews/pr-${{ github.event.pull_request.number }}/preview/';
            const runUrl = 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}';

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deploymentId,
              state: 'success',
              environment_url: previewUrl,
              log_url: runUrl,
              description: 'Preview deployed'
            });

      - name: Mark PR deployment failure
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            const deploymentId = Number('${{ steps.create_deployment.outputs.deployment_id }}');
            if (!deploymentId) {
              core.info('No deployment id found; skipping deployment status update.');
              return;
            }

            const runUrl = 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}';

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deploymentId,
              state: 'failure',
              log_url: runUrl,
              description: 'Preview deployment failed'
            });
