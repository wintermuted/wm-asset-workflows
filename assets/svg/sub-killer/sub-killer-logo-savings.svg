<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Sub Killer Savings Logo</title>
  <desc id="desc">Crossed recurring subscription arrows above a growing stack of coins to represent canceled subscriptions and money saved.</desc>

  <rect x="4" y="4" width="120" height="120" rx="24" fill="#101828"/>

  <!-- Recurring subscription symbol -->
  <path d="M40 46a24 24 0 0 1 40-12" fill="none" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
  <path d="M88 36l-10 1 6-8" fill="none" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M88 54a24 24 0 0 1-40 12" fill="none" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
  <path d="M40 64l10-1-6 8" fill="none" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Cancel slash -->
  <path d="M30 70l68-44" fill="none" stroke="#f97316" stroke-width="10" stroke-linecap="round"/>

  <!-- Savings coin stack -->
  <ellipse cx="64" cy="94" rx="27" ry="8" fill="#16a34a"/>
  <rect x="37" y="84" width="54" height="10" fill="#22c55e"/>
  <ellipse cx="64" cy="84" rx="27" ry="8" fill="#4ade80"/>

  <rect x="44" y="74" width="40" height="10" fill="#22c55e"/>
  <ellipse cx="64" cy="74" rx="20" ry="7" fill="#86efac"/>

  <path d="M64 68v16" fill="none" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  <path d="M70 72c-2-2-10-2-12 1-2 3 1 6 6 7 5 1 8 4 6 7-2 3-10 3-13 0" fill="none" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
</svg>
