<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wm-asset-workflows Preview</title>
    <link rel="stylesheet" href="/node_modules/@wintermuted/ui-theme/index.css" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  </head>
  <body>
    <div class="preview-shell">
      <header class="app-header">
        <div class="app-brand">
          <h1>wm-asset-workflows</h1>
          <p class="app-byline">SVG-first logos and glyphs with markdown diagrams and screenshot capture.</p>
        </div>
        <div class="app-header-actions">
          <button id="theme-toggle" type="button" class="btn btn-sm">Toggle Theme</button>
        </div>
      </header>

      <main class="preview-content">
        <section class="card">
          <div class="card-header">
            <h3>Logo and Glyph Sources</h3>
          </div>
          <div class="card-body">
            <div id="logo-grid" class="asset-grid"></div>
          </div>
        </section>

        <section class="card">
          <div class="card-header">
            <h3>Markdown Diagram Specs</h3>
          </div>
          <div class="card-body">
            <div id="diagram-grid" class="asset-grid"></div>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
